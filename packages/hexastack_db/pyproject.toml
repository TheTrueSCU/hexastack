[project]
name = "hexastack-db"
version = "0.1.0"
description = "SQLAlchemy database integration, repositories, Unit of Work, and bootstrap for Hexastack"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "hexastack-core",
    "sqlalchemy>=2.0.38",
]

[project.optional-dependencies]
sqlite = [
    "aiosqlite>=0.20.0",
]
postgresql = [
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
]
pgvector = [
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
]
migrations = [
    "alembic>=1.13.0",
]
all = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
]

[project.entry-points."hexastack.bootstrappers"]
db = "hexastack_db.infra.bootstrap:DatabaseBootstrapper"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
hexastack-core = { workspace = true }

[tool.importlinter]
root_packages = ["hexastack_db"]

[[tool.importlinter.contracts]]
name = "Hexagonal architecture layer hierarchy"
type = "layers"
containers = ["hexastack_db"]
layers = [
    "adapters",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Forbidden imports for domain"
type = "forbidden"
source_modules = ["hexastack_db.domain"]
forbidden_modules = [
    "hexastack_db.adapters",
    "hexastack_db.infra",
]

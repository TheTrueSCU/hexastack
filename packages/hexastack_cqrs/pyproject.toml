[project]
name = "hexastack-cqrs"
version = "0.3.0"
description = "CQRS commands, queries, events, buses, and execution pipeline for Hexastack"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "hexastack-core",
    "stamina>=24.2.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
huey = [
    "huey>=3.3.4",
]


[project.entry-points."hexastack.bootstrappers"]
cqrs = "hexastack_cqrs.infra.bootstrap:CqrsBootstrapper"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
hexastack-core = { workspace = true }

[tool.importlinter]
root_packages = ["hexastack_cqrs"]

[[tool.importlinter.contracts]]
name = "Hexagonal architecture layer hierarchy"
type = "layers"
containers = ["hexastack_cqrs"]
layers = [
    "infra",
    "adapters",
    "ports",
    "domain",
]

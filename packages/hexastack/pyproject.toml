[project]
name = "hexastack"
version = "0.3.0"
description = "Hexastack - Modern Hexagonal Architecture & CQRS Framework for Python"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "hexastack-core",
    "hexastack-cqrs",
    "hexastack-logging",
]

[project.optional-dependencies]
ai = [
    "hexastack-ai",
]
apprise = [
    "hexastack-events[apprise]",
]
auth = [
    "hexastack-auth",
]
cli = [
    "hexastack-cli",
]
db = [
    "hexastack-db",
]
diskcache = [
    "hexastack-core[diskcache]",
]
docs = [
    "hexastack-fastapi[docs]",
]
events = [
    "hexastack-events",
]
fastapi = [
    "hexastack-fastapi",
]
filelock = [
    "hexastack-core[filelock]",
    "hexastack-events[filelock]",
]
flagd = [
    "hexastack-flags[flagd]",
]
flags = [
    "hexastack-flags",
]
fsspec = [
    "hexastack-core[fsspec]",
]
graphql = [
    "hexastack-graphql",
]
grpc = [
    "hexastack-grpc",
]
huey = [
    "hexastack-cqrs[huey]",
    "hexastack-events[huey]",
]
janus = [
    "hexastack-events[janus]",
]
loguru = [
    "hexastack-logging[loguru]",
]
mcp = [
    "hexastack-mcp",
]
migrations = [
    "hexastack-db[migrations]",
]
msgspec = [
    "hexastack-events[msgspec]",
]
nats = [
    "hexastack-events[nats]",
]
opa = [
    "hexastack-auth[opa]",
]
openfga = [
    "hexastack-auth[openfga]",
]
otel = [
    "hexastack-otel",
]
otlp = [
    "hexastack-otel[otlp]",
]
pgvector = [
    "hexastack-db[pgvector]",
]
postgresql = [
    "hexastack-db[postgresql]",
]
ratelimit = [
    "hexastack-fastapi[ratelimit]",
]
redis = [
    "hexastack-core[redis]",
]
reflection = [
    "hexastack-grpc[reflection]",
]
rich = [
    "hexastack-logging[rich]",
]
sentry = [
    "hexastack-logging[sentry]",
]
spiffe = [
    "hexastack-auth[spiffe]",
]
sql = [
    "hexastack-db",
    "hexastack-events[sql]",
]
sqlite = [
    "hexastack-db[sqlite]",
]
structlog = [
    "hexastack-logging[structlog]",
]
testing = [
    "faker>=33.0.0",
    "hypothesis>=6.100.0",
    "inline-snapshot>=0.35.4",
    "playwright>=1.49.0",
    "pytest-archon>=0.0.7",
    "schemathesis>=3.39.0",
]
tools = [
    "hexastack-tools",
]
ui = [
    "hexastack-fastapi[ui]",
]
valkey = [
    "hexastack-core[valkey]",
]
web = [
    "hexastack-fastapi",
    "uvicorn[standard]>=0.30.0",
]

all = [
    "hexastack-ai",
    "hexastack-auth",
    "hexastack-cli",
    "hexastack-db[all]",
    "hexastack-events",
    "hexastack-fastapi",
    "hexastack-flags",
    "hexastack-graphql",
    "hexastack-grpc[reflection]",
    "hexastack-logging[all,sentry]",
    "hexastack-mcp",
    "hexastack-otel[otlp]",
    "hexastack-tools",
    "uvicorn[standard]>=0.30.0",
]



[project.scripts]
hexastack = "hexastack.entrypoint:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
hexastack-ai = { workspace = true }
hexastack-auth = { workspace = true }
hexastack-core = { workspace = true }
hexastack-cqrs = { workspace = true }
hexastack-logging = { workspace = true }
hexastack-events = { workspace = true }
hexastack-fastapi = { workspace = true }
hexastack-flags = { workspace = true }
hexastack-cli = { workspace = true }
hexastack-db = { workspace = true }
hexastack-graphql = { workspace = true }
hexastack-grpc = { workspace = true }
hexastack-mcp = { workspace = true }
hexastack-otel = { workspace = true }
hexastack-tools = { workspace = true }

[tool.importlinter]
root_packages = ["hexastack"]

[[tool.importlinter.contracts]]
name = "Hexagonal architecture layer hierarchy"
type = "layers"
containers = ["hexastack"]
layers = [
    "adapters",
    "domain",
]

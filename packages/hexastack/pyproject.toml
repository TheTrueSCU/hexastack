[project]
name = "hexastack"
version = "0.1.0"
description = "Hexastack - Modern Hexagonal Architecture & CQRS Framework for Python"
readme = "README.md"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "hexastack-core",
    "hexastack-cqrs",
    "hexastack-logging",
]

[project.optional-dependencies]
cli = [
    "hexastack-cli",
]
db = [
    "hexastack-db",
]
sql = [
    "hexastack-db",
]
fastapi = [
    "hexastack-fastapi",
]
web = [
    "hexastack-fastapi",
    "uvicorn[standard]>=0.30.0",
]
all = [
    "hexastack-cli",
    "hexastack-db",
    "hexastack-fastapi",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
hexastack = "hexastack.entrypoint:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
hexastack-core = { workspace = true }
hexastack-cqrs = { workspace = true }
hexastack-logging = { workspace = true }
hexastack-fastapi = { workspace = true }
hexastack-cli = { workspace = true }
hexastack-db = { workspace = true }

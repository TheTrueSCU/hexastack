[project]
name = "hexastack-logging"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "hexastack-core",
]

[project.optional-dependencies]
loguru = ["loguru>=0.7.0"]
rich = ["rich>=13.0.0"]
structlog = ["structlog>=24.0.0"]
all = [
    "loguru>=0.7.0",
    "rich>=13.0.0",
    "structlog>=24.0.0",
]
sentry = [
    "sentry-sdk>=2.0.0",
]

[project.entry-points."hexastack.bootstrappers"]
logging = "hexastack_logging.infra.bootstrap:LoggingBootstrapper"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
hexastack-core = { workspace = true }

[tool.importlinter]
root_packages = ["hexastack_logging"]

[[tool.importlinter.contracts]]
name = "Hexagonal architecture layer hierarchy"
type = "layers"
containers = ["hexastack_logging"]
layers = [
    "infra",
    "adapters",
]

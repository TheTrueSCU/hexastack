[project]
name = "hexastack-fastapi"
version = "0.1.0"
description = "FastAPI presentation adapter for Hexastack"
readme = "README.md"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "hexastack-core",
    "hexastack-cqrs",
]

[project.optional-dependencies]
auth = [
    "hexastack-auth",
]
docs = [
    "zensical>=0.0.56",
]
testing = [
    "playwright>=1.49.0",
    "schemathesis>=3.39.0",
]
ui = [
    "nicegui>=2.0.0",
]

[project.entry-points."hexastack.bootstrappers"]
fastapi = "hexastack_fastapi.infra.bootstrap:FastApiBootstrapper"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
hexastack-auth = { workspace = true }
hexastack-core = { workspace = true }
hexastack-cqrs = { workspace = true }

[tool.importlinter]
root_packages = ["hexastack_fastapi"]

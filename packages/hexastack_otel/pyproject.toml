[project]
name = "hexastack-otel"
version = "0.0.0"
description = "OpenTelemetry distributed tracing, OTLP exporter integration, and CQRS tracing middleware for Hexastack"
readme = "README.md"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "hexastack-core",
    "hexastack-cqrs",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
otlp = [
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.entry-points."hexastack.bootstrappers"]
otel = "hexastack_otel.infra.bootstrap:OtelBootstrapper"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
hexastack-core = { workspace = true }
hexastack-cqrs = { workspace = true }

[tool.importlinter]
root_packages = ["hexastack_otel"]

[[tool.importlinter.contracts]]
name = "Hexagonal architecture layer hierarchy"
type = "layers"
containers = ["hexastack_otel"]
layers = [
    "adapters",
    "ports",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Forbidden imports for domain"
type = "forbidden"
source_modules = ["hexastack_otel.domain"]
forbidden_modules = [
    "hexastack_otel.ports",
    "hexastack_otel.adapters",
    "hexastack_otel.infra",
]

[[tool.importlinter.contracts]]
name = "Forbidden imports for ports"
type = "forbidden"
source_modules = ["hexastack_otel.ports"]
forbidden_modules = [
    "hexastack_otel.adapters",
    "hexastack_otel.infra",
]

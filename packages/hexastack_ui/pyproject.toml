[project]
name = "hexastack-ui"
version = "0.4.0"
description = "Reactive UI and DevTools presentation adapters for Hexastack"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "hexastack-core",
    "hexastack-cqrs",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.141.1",
]
nicegui = [
    "fastapi>=0.141.1",
    "nicegui>=2.0.0",
]
devtools = [
    "hexastack-ui[nicegui]",
]
textual = [
    "textual>=0.70.0",
]
all = [
    "hexastack-ui[nicegui,textual]",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
hexastack-core = { workspace = true }
hexastack-cqrs = { workspace = true }

[tool.importlinter]
root_packages = ["hexastack_ui"]

[[tool.importlinter.contracts]]
name = "Hexagonal architecture layer hierarchy"
type = "layers"
containers = ["hexastack_ui"]
layers = [
    "infra",
    "adapters",
    "ports",
    "domain",
]

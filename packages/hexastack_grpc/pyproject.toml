[project]
name = "hexastack-grpc"
version = "0.1.0"
description = "High-performance gRPC presentation adapter and interceptors for Hexastack"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.68.0",
    "hexastack-core",
    "hexastack-cqrs",
    "protobuf>=5.29.0",
]

[project.optional-dependencies]
reflection = [
    "grpcio-reflection>=1.68.0",
]

[project.entry-points."hexastack.bootstrappers"]
grpc = "hexastack_grpc.infra.bootstrap:GrpcBootstrapper"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
hexastack-core = { workspace = true }
hexastack-cqrs = { workspace = true }


[[tool.importlinter.contracts]]
name = "Hexagonal architecture layer hierarchy"
type = "layers"
containers = ["hexastack_grpc"]
layers = [
    "adapters",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Forbidden imports for domain"
type = "forbidden"
source_modules = ["hexastack_grpc.domain"]
forbidden_modules = [
    "hexastack_grpc.adapters",
    "hexastack_grpc.infra",
]

[tool.importlinter]
root_packages = ["hexastack_grpc"]

[[tool.importlinter.contracts]]
name = "Hexagonal architecture layer hierarchy"
type = "layers"
containers = ["hexastack_grpc"]
layers = [
    "adapters",
    "infra",
    "domain",
]

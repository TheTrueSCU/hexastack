[project]
name = "financial-ledger"
version = "0.1.0"
description = "Production-grade Double-Entry Financial Ledger Microservice powered by Hexastack."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hexastack[fastapi,db,ui]>=0.1.0",
]

[project.scripts]
financial-ledger = "financial_ledger.infra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "complexipy>=7.0.1",
    "detect-secrets>=1.5.0",
    "faker>=33.0.0",
    "hypothesis>=6.100.0",
    "import-linter>=2.13",
    "locust>=2.31.0",
    "memray>=1.13.0",
    "pip-audit>=2.8.0",
    "pre-commit>=3.8.0",
    "py-spy>=0.3.14",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-randomly>=4.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.2",
    "ty>=0.0.69",
    "vulture>=2.11",
]

[tool.complexipy]
max_complexity_allowed = 25

[tool.coverage.run]
source = ["src/"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
addopts = "-n auto --import-mode=importlib --cov=src --cov-fail-under=90 --cov-report=term-missing"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "S", "SIM", "UP", "W"]
ignore = ["D100", "D104", "D107", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

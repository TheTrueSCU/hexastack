repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(\.venv|docs|_build)/

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-lint
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ty
        name: ty (type checker)
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: import-linter
        name: import-linter (hexagonal boundaries)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false

      - id: complexipy
        name: complexipy (cyclomatic complexity)
        entry: uv run complexipy src/
        language: system
        types: [python]
        pass_filenames: false

      - id: vulture
        name: vulture (dead code detector)
        entry: uv run vulture
        language: system
        files: ^src/.*\.py$
        pass_filenames: false

      - id: pip-audit
        name: pip-audit (dependency vulnerability scan)
        entry: uv run pip-audit --local
        language: system
        pass_filenames: false

[project]
name = "todo-app"
version = "0.7.0"
description = "Hexagonal To-Do Microservice Tutorial"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hexastack[all]",
]

[project.scripts]
todo-app = "todo_app.adapters.driving.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "complexipy>=7.0.1",
    "hypothesis>=6.100.0",
    "import-linter>=2.13",
    "pre-commit>=3.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-randomly>=4.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.2",
    "ty>=0.0.84",
]

[tool.complexipy]
max_complexity_allowed = 25

[tool.coverage.run]
source = ["src/"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
addopts = "-n auto --import-mode=importlib --cov=src --cov-fail-under=90 --cov-report=term-missing"
markers = [
    "ch01: Tests belonging to Chapter 1 (In-Memory Core & CQRS)",
    "ch02: Tests belonging to Chapter 2 (SQLite Persistence & Migrations)",
    "ch03: Tests belonging to Chapter 3 (JWT Auth & RBAC Security)",
    "ch04: Tests belonging to Chapter 4 (Transactional Outbox & Events)",
    "ch05: Tests belonging to Chapter 5 (AI Assistant, MCP & Feature Flags)",
    "ch06: Tests belonging to Chapter 6 (Production Observability & Logging)",
]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "S", "SIM", "UP", "W"]
ignore = ["D100", "D104", "D107", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["ARG", "D", "E501", "S101", "S105"]

[tool.uv]
override-dependencies = [
    "mako>=1.4.2",
    "multidict>=6.9.1,<7.0.0",
    "pyjwt>=2.14.0",
    "virtualenv>=21.7.13",
    "werkzeug>=3.1.9",
]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: ^tests/.*/helpers/
      - id: pretty-format-json
        args: [--autofix, --indent=4, --no-sort-keys]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^examples/
      - id: ruff-format
        exclude: ^examples/

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.23
    hooks:
      - id: validate-pyproject

  - repo: local
    hooks:
      - id: api-surface
        name: api surface & __all__ integrity
        entry: uv run python scripts/check_api_surface.py
        language: system
        types: [python]
        pass_filenames: false
      - id: complexipy
        name: complexipy
        entry: uv run complexipy packages --staged --max-complexity-allowed 25
        language: system
        types: [python]
        pass_filenames: false
      - id: cpd
        name: cpd (copy-paste detector)
        entry: cpd packages/ --threshold 5 --min-tokens 50 --ignore "**/tests/**,**/testing/**" --no-tips
        language: system
        pass_filenames: false
      - id: docs-build
        name: zensical docs build validation
        entry: uv run zensical build
        language: system
        files: ^(docs/|zensical\.toml|mkdocs\.yml)
        pass_filenames: false
      - id: import-linter-root
        name: import-linter (package boundaries)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter-packages
        name: import-linter (hexagonal boundaries)
        entry: uv run import-linter-run
        language: system
        files: ^packages/.*(\.py|pyproject\.toml)$
        pass_filenames: true
      - id: ty-check
        name: ty check
        entry: uv run ty check packages
        language: system
        types: [python]
        pass_filenames: false

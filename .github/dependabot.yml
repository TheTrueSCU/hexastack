# Dependabot configuration for the Hexastack monorepo.
#
# Notes:
#   - uv workspaces are not yet natively supported; the `pip` ecosystem is used
#     and reads each package's pyproject.toml directly.
#   - Each workspace package gets its own entry so per-package PRs are scoped
#     to that package's dependency graph.
#   - Minor and patch updates are grouped per-directory to reduce PR noise.
#     Major version bumps always get their own PR (not auto-merged).
#   - GitHub Actions updates are separate from Python dependency updates.

version: 2

updates:

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "05:00"
      timezone: UTC
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, github-actions]

  # ── Python: workspace root ───────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    groups:
      workspace-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, python]

  # ── Python: packages/* ───────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /packages/hexastack
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    groups:
      hexastack-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, python, hexastack]


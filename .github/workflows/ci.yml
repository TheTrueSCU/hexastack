name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Pre-Commit & Unit/Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Run Pre-Commit Quality Checks
        run: SKIP=cpd uv run pre-commit run --all-files

      - name: Install Copy-Paste Detection
        run: cargo install cpd --locked

      - name: Run Copy-Paste Detection
        run: |
          cpd --input packages/
              --threshold 5 \
              --min-tokens 50 \
              --ignore "**/tests/**,**/testing/**" \
              --no-tips

      - name: Run Unit & Integration Tests
        run: uv run pytest packages/ --ignore-glob="packages/*/tests/properties/*"

  hypothesis:
    name: Property-Based Fuzzing
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Run Property-Based Fuzzing
        run: uv run pytest packages/*/tests/properties

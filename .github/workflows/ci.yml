name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # =========================================================================
  # Stage 1: Fast Quality Gate & Schema Governance (Fail-Fast Static Checks)
  # =========================================================================
  quality-gate:
    name: Pre-Commit Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Visualize Pipeline DAG & Critical Path via Hexaflow
        if: always()
        run: |
          uvx --python 3.13 --from "hexaflow>=0.5.0" hexaflow graph render .github/workflows/ci.yml --summary --critical-path

      - name: Install Copy-Paste Detection
        run: cargo install jscpd --locked

      - name: Run Quality Gate via Hexaqual
        uses: TheTrueSCU/hexaqual@108c0efb126e472efb145d9090133db6786b9451 # v0.9.10
        with:
          sync-args: "--all-packages --all-extras --all-groups"

      - name: Audit Repository Quality Gates
        run: uv run hexaqual sanity --audit-gates

      - name: Verify Documentation Consistency (Anti-Drift Linter)
        run: uv run hexaqual docs drift

  buf-governance:
    name: Protobuf Governance (Buf Lint & Breaking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Buf Lint
        uses: bufbuild/buf-lint-action@06f9dd823d873146471cfaaf108a993fe00e5325 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Buf Breaking Change Detection
        if: github.event_name == 'pull_request'
        uses: bufbuild/buf-breaking-action@c57b3d842a5c3f3b454756ef65305a50a587c5ba # v1
        with:
          against: 'https://github.com/${{ github.repository }}.git#branch=main'
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # Stage 1b: Dynamic Compute Cluster Discovery & Probe
  # Discovers online compute nodes in parallel with static quality checks.
  # Probes reachability and sets up outputs for downstream cloud test runs.
  # =========================================================================
  cluster-probe:
    name: Cluster Reachability & Health Probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cluster_ready: ${{ steps.probe.outputs.cluster_ready }}
      cluster_host: ${{ steps.probe.outputs.cluster_host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Probe Hexaqueue Cloud Fleet
        id: probe
        uses: TheTrueSCU/hexaqueue@v0.8.0
        with:
          cluster-env: ${{ secrets.HEXAQUEUE_ENV }}
          version: ">=0.8.0"
          probe-only: "true"
          step-summary: "true"

  # =========================================================================
  # Stage 2: Unit / Integration Tests & Architecture Verification
  # Only executes if Stage 1 static quality checks succeed
  # Dynamically offloads to Hexaqueue Cloud or falls back to local xdist
  # =========================================================================
  test-suite:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    needs: [quality-gate, cluster-probe]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Connect to Hexaqueue Cluster (Cloud Execution)
        if: needs.cluster-probe.outputs.cluster_ready == 'true'
        uses: TheTrueSCU/hexaqueue@v0.8.0
        with:
          cluster-env: ${{ secrets.HEXAQUEUE_ENV }}
          version: ">=0.8.0"
          auto-tunnel: "true"
          step-summary: "false"

      - name: Run Tests via Hexaqueue Cloud (Push to Main / Manual Dispatch)
        if: needs.cluster-probe.outputs.cluster_ready == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: uv run hexaqual test run -U --profile ci --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Run Affected Tests via Hexaqueue Cloud (Pull Request)
        if: needs.cluster-probe.outputs.cluster_ready == 'true' && github.event_name == 'pull_request'
        run: uv run hexaqual test run -A -U --profile ci --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Run Tests Locally via xdist (Push to Main / Manual Dispatch - Local Fallback)
        if: needs.cluster-probe.outputs.cluster_ready != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: uv run hexaqual test run -U --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Run Affected Tests Locally via xdist (Pull Request - Local Fallback)
        if: needs.cluster-probe.outputs.cluster_ready != 'true' && github.event_name == 'pull_request'
        run: uv run hexaqual test run -A -U --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: junit.xml

      - name: Generate Test Execution Summary
        if: always() && hashFiles('junit.xml') != ''
        env:
          CLUSTER_READY: ${{ needs.cluster-probe.outputs.cluster_ready }}
          CLUSTER_HOST: ${{ needs.cluster-probe.outputs.cluster_host }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python3 -c "
          import os, xml.etree.ElementTree as ET
          try:
              tree = ET.parse('junit.xml')
              root = tree.getroot()
              suites = list(root) if root.tag == 'testsuites' else [root]
              tests = sum(int(s.attrib.get('tests', 0)) for s in suites)
              failures = sum(int(s.attrib.get('failures', 0)) for s in suites)
              errors = sum(int(s.attrib.get('errors', 0)) for s in suites)
              skipped = sum(int(s.attrib.get('skipped', 0)) for s in suites)
              duration = sum(float(s.attrib.get('time', 0.0)) for s in suites)
              passed = tests - failures - errors - skipped

              summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_path:
                  cluster_ready = os.environ.get('CLUSTER_READY') == 'true'
                  cluster_host = os.environ.get('CLUSTER_HOST', '')
                  py_ver = os.environ.get('PYTHON_VERSION', '')
                  engine_str = f'⚡ Hexaqueue Cloud Fleet (\`{cluster_host}\` via Zero-Trust SSH Tunnel)' if cluster_ready else '🖥️ Local Runner (In-Process xdist)'

                  with open(summary_path, 'a') as f:
                      f.write(f'### 🧪 Test Execution Summary (Python {py_ver})\n\n')
                      f.write(f'- **Execution Engine**: {engine_str}\n')
                      f.write(f'- **Total Tests**: \`{tests}\`\n')
                      f.write(f'- **Results**: ✅ \`{passed}\` passed, ❌ \`{failures}\` failed, ⚠️ \`{errors}\` errors, ⏭️ \`{skipped}\` skipped\n')
                      f.write(f'- **Aggregated Suite Duration**: \`{duration:.2f}s\`\n\n')
          except Exception as exc:
              print(f'Error generating test summary: {exc}')
          " || true

      - name: Disconnect Hexaqueue Cluster Tunnel
        if: always() && needs.cluster-probe.outputs.cluster_ready == 'true'
        run: uv run hq cluster tunnel --stop || true

  architecture-diagrams:
    name: Architecture Diagram Verification
    needs: [quality-gate]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Check pydeps diagrams are up to date
        run: |
          uv run hexaqual deps pydeps
          git diff --exit-code docs/assets/pydeps/ || \
            (echo "::error::Architecture diagrams are stale. Run 'hexaqual deps pydeps' locally and commit the updated SVGs." && exit 1)

  # =========================================================================
  # Stage 3: Invariant & Security Fuzzing (Deep Verification)
  # Only executes on PRs if Unit & Integration test suite passed cleanly
  # =========================================================================
  hypothesis-fuzzing:
    name: Property-Based State Machine Fuzzing
    needs: [test-suite]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Run Affected Property-Based State Machine Testing
        run: uv run hexaqual test run -A -P --no-cov --allow-empty

  # =========================================================================
  # Stage 4: E2E Browser, Narrator Demos & Visual Accessibility (axe-core)
  # Runs Playwright Chromium tests and UI accessibility scans
  # =========================================================================
  e2e-a11y:
    name: E2E Browser & A11y Verification
    needs: [test-suite]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright Chromium & OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium

      - name: Run E2E & Visual A11y Tests
        run: uv run pytest tests/e2e --no-cov

  mutation-verification:
    name: Mutation Testing Verification
    needs: [test-suite]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Run Affected Mutation Testing Verification
        run: uv run hexaqual mutate run -A -e gremlins -w auto --batch-size 10 -n auto

  # =========================================================================
  # Stage 5: Unified CI Success Status Check (Branch Protection Gate)
  # Aggregates results of all upstream stages, handling skipped conditional jobs
  # =========================================================================
  ci-success:
    name: CI Success (All Required Checks)
    needs:
      - quality-gate
      - buf-governance
      - cluster-probe
      - test-suite
      - architecture-diagrams
      - hypothesis-fuzzing
      - e2e-a11y
      - mutation-verification
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: always()

      - name: Install uv
        if: always()
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Generate CI Duration Breakdown & Trend Chart
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run hexaqual gh ci-duration --workflow CI --branch main --summary --pr "${{ github.event.pull_request.number }}" || true

      - name: Verify All Upstream Jobs Succeeded or Skipped
        run: |
          echo "Evaluating CI pipeline status:"
          echo "  Pre-Commit Quality Gate:      ${{ needs.quality-gate.result }}"
          echo "  Protobuf Governance:          ${{ needs.buf-governance.result }}"
          echo "  Cluster Probe:                ${{ needs.cluster-probe.result }}"
          echo "  Unit & Integration Tests:     ${{ needs.test-suite.result }}"
          echo "  Architecture Diagrams:        ${{ needs.architecture-diagrams.result }}"
          echo "  Property-Based Fuzzing:       ${{ needs.hypothesis-fuzzing.result }}"
          echo "  E2E & A11y Verification:      ${{ needs.e2e-a11y.result }}"
          echo "  Mutation Testing:             ${{ needs.mutation-verification.result }}"

          results=(
            "${{ needs.quality-gate.result }}"
            "${{ needs.buf-governance.result }}"
            "${{ needs.cluster-probe.result }}"
            "${{ needs.test-suite.result }}"
            "${{ needs.architecture-diagrams.result }}"
            "${{ needs.hypothesis-fuzzing.result }}"
            "${{ needs.e2e-a11y.result }}"
            "${{ needs.mutation-verification.result }}"
          )

          for res in "${results[@]}"; do
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "::error::One or more upstream CI jobs failed or were cancelled."
              exit 1
            fi
          done

          echo "🎉 All required CI jobs completed successfully (or were cleanly skipped)."

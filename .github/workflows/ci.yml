name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  # =========================================================================
  # Stage 1: Fast Quality Gate & Schema Governance (Fail-Fast Static Checks)
  # =========================================================================
  quality-gate:
    name: Pre-Commit Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Install Copy-Paste Detection
        run: cargo install jscpd --locked

      - name: Run Pre-Commit Quality Checks
        run: uv run pre-commit run --all-files

  buf-governance:
    name: Protobuf Governance (Buf Lint & Breaking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Buf Lint
        uses: bufbuild/buf-lint-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Buf Breaking Change Detection
        if: github.event_name == 'pull_request'
        uses: bufbuild/buf-breaking-action@v1
        with:
          against: 'https://github.com/${{ github.repository }}.git#branch=main'
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # Stage 2: Unit / Integration Tests & Architecture Verification
  # Only executes if Stage 1 static quality checks succeed
  # =========================================================================
  test-suite:
    name: Unit & Integration Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Run Unit & Integration Tests (Push to Main)
        if: github.event_name == 'push'
        run: uv run pytest-run -U --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Run Affected Unit & Integration Tests (Pull Request)
        if: github.event_name == 'pull_request'
        run: uv run pytest-run -A -U --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: junit.xml

  architecture-diagrams:
    name: Architecture Diagram Verification
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Check pydeps diagrams are up to date
        run: |
          uv run pydeps-generate
          git diff --exit-code docs/assets/pydeps/ || \
            (echo "::error::Architecture diagrams are stale. Run 'pydeps-generate' locally and commit the updated SVGs." && exit 1)

  # =========================================================================
  # Stage 3: Invariant & Security Fuzzing (Deep Verification)
  # Only executes on PRs if Unit & Integration test suite passed cleanly
  # =========================================================================
  hypothesis-fuzzing:
    name: Property-Based State Machine Fuzzing
    needs: [test-suite]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Run Affected Property-Based Fuzzing
        run: uv run pytest-run -A -P --no-cov

  # =========================================================================
  # Stage 4: E2E Browser, Narrator Demos & Visual Accessibility (axe-core)
  # Runs Playwright Chromium tests and UI accessibility scans
  # =========================================================================
  e2e-a11y:
    name: E2E Browser & A11y Verification
    needs: [test-suite]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright Chromium & OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium

      - name: Run E2E & Visual A11y Tests
        run: uv run pytest tests/e2e --no-cov

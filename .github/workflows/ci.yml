name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Pre-Commit & Unit/Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Install Copy-Paste Detection
        run: cargo install jscpd --locked

      - name: Run Pre-Commit Quality Checks
        run: uv run pre-commit run --all-files

      - name: Run Unit & Integration Tests
        run: uv run pytest packages/ --ignore-glob="packages/*/tests/properties/*" --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Check pydeps diagrams are up to date
        run: |
          uv run pydeps-generate
          git diff --exit-code docs/assets/pydeps/ || \
            (echo "::error::Architecture diagrams are stale. Run 'pydeps-generate' locally and commit the updated SVGs." && exit 1)

  hypothesis:
    name: Property-Based Fuzzing
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Run Property-Based Fuzzing
        run: uv run pytest packages/*/tests/properties --no-cov

  buf-governance:
    name: Protobuf Governance (Buf Lint & Breaking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1.50.0

      - name: Run Buf Lint
        uses: bufbuild/buf-lint-action@v1

      - name: Run Buf Breaking Change Detection
        if: github.event_name == 'pull_request'
        uses: bufbuild/buf-breaking-action@v1
        with:
          against: 'https://github.com/${{ github.repository }}.git#branch=main'

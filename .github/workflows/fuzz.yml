name: Coverage-Guided & Security Fuzzing

on:
  schedule:
    - cron: "0 2 * * 0"  # 02:00 UTC every Sunday
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of fuzzing runs per harness"
        required: false
        default: "5000"
        type: string

permissions: read-all

jobs:
  fuzz:
    name: Atheris & OWASP Security Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Dependencies & Atheris
        run: |
          uv sync --all-packages --all-extras --all-groups
          uv pip install atheris

      - name: Execute Coverage-Guided & OWASP Fuzzing
        run: |
          RUNS="${{ github.event.inputs.runs || '5000' }}"
          uv run fuzz-run --target all --runs "$RUNS" --engine auto

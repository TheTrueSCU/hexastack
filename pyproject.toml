[project]
name = "hexastack-workspace"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/*",
]

[dependency-groups]
dev = [
    "alembic>=1.19.1",
    "httpx>=0.27.0",
    "hypothesis>=6.100.0",
    "import-linter>=2.13",
    "pre-commit>=3.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-randomly>=4.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

[tool.pytest.ini_options]
addopts = "-n auto --import-mode=importlib"
